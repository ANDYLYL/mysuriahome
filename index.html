        const Award = ({ className, ...props }) => (

                <path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526" />

        const SURIA_SCHEME_VALID_FROM = "2026-12-31T23:59:59+08:00"; 

        function App() {
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [timeLeft, setTimeLeft] = useState({
                days: 0, hours: 0, minutes: 0, seconds: 0, isLaunched: false,
            });

            const [billAmount, setBillAmount] = useState(450);

            const [formData, setFormData] = useState({
                name: "", phone: "", email: "",
                stateLocation: "Kuala Lumpur",
                propertyType: "Landed Terrace",
                preferredContact: "WhatsApp",
                agreePolicy: false,
                selectedSlotDate: "",
                selectedSlotTime: "Morning (10:00 AM - 1:00 PM)",
            });
            const [formStep, setFormStep] = useState(1);
            const [isSubmitted, setIsSubmitted] = useState(false);

            useEffect(() => {
                const calculateTimeLeft = () => {
                    const now = new Date().getTime();
                    const launchDate = new Date(SURIA_SCHEME_VALID_FROM).getTime();
                    const difference = launchDate - now;

                    if (difference <= 0) {
                        setTimeLeft((prev) => ({ ...prev, isLaunched: true }));
                        return;
                    }

                    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
                    const minutes = Math.floor((difference / 1000 / 60) % 60);
                    const seconds = Math.floor((difference / 1000) % 60);

                    setTimeLeft({ days, hours, minutes, seconds, isLaunched: false });
                };

                calculateTimeLeft();
                const interval = setInterval(calculateTimeLeft, 1000);
                return () => clearInterval(interval);
            }, []);

            const calculation = useMemo(() => {
                let capacity = 4; let estCost = 16000; let rebate = 2400; let monthlySavings = 120;
                let tierLabel = "Tier 1: Comfort Eco Starter";

                if (billAmount < 150) {
                    capacity = 4; estCost = 16000; rebate = 2400; monthlySavings = 120;
                    tierLabel = "Tier 1: Comfort Eco Starter (1-Phase)";
                } else if (billAmount >= 150 && billAmount <= 300) {
                    capacity = 6; estCost = 22000; rebate = 3000; monthlySavings = 250;
                    tierLabel = "Tier 2: Premium Residential Standard";
                } else if (billAmount >= 301 && billAmount <= 500) {
                    capacity = 9; estCost = 31000; rebate = 3000; monthlySavings = 460;
                    tierLabel = "Tier 3: Executive Smart Power (3-Phase)";
                } else if (billAmount >= 501 && billAmount <= 800) {
                    capacity = 12; estCost = 41000; rebate = 3000; monthlySavings = 690;
                    tierLabel = "Tier 4: Enhanced 3-Phase High Capacity";
                } else {
                    capacity = 15; estCost = 50000; rebate = 3000; monthlySavings = 920;
                    tierLabel = "Tier 5: Ultimate Energy Independence Max";
                }

                const finalCost = estCost - rebate; 
                const paybackYears = Number((finalCost / (monthlySavings * 12)).toFixed(1));
                const panelsCount = Math.round((capacity * 1000) / 550); 
                const roofSpace = capacity * 65; 
                const co2Offset = Number((capacity * 1.25).toFixed(2)); 

                return {
                    capacity, estCost, rebate, finalCost, monthlySavings, paybackYears, panelsCount, roofSpace, co2Offset, tierLabel,
                };
            }, [billAmount]);

            const currentYear = new Date().getFullYear();

            const handleSmoothScroll = (targetId) => {
                const target = document.getElementById(targetId);
                if (target) {
                    target.scrollIntoView({ behavior: "smooth" });
                }
                setIsMobileMenuOpen(false);
            };

            const handleSubmitForm = (e) => {
                e.preventDefault();
                setIsSubmitted(true);
            };

            return (
                <div className="min-h-screen bg-suria-dark font-sans text-white/90 antialiased selection:bg-suria-gold selection:text-black">

                                </div>

                                    </span>

                                </div>
                            </div>

                            <div className="hidden md:flex items-center gap-8">
                                <button onClick={() => handleSmoothScroll("scheme-deep-dive")} className="text-sm font-medium text-slate-400 transition-colors hover:text-white">SuRIA Scheme 2026</button>
                                <button onClick={() => handleSmoothScroll("interactive-calculator")} className="text-sm font-medium text-slate-400 transition-colors hover:text-white">Savings Calculator</button>
                                <button onClick={() => handleSmoothScroll("site-survey")} className="text-sm font-medium text-slate-400 transition-colors hover:text-white">Claim Rebate</button>
                            </div>

                            <div className="flex items-center gap-3">
                                <button onClick={() => handleSmoothScroll("site-survey")} className="relative hidden items-center justify-center rounded-lg bg-suria-gold px-5 py-2.5 text-xs font-bold uppercase tracking-widest text-black transition-all hover:bg-yellow-500 hover:shadow-lg sm:flex">Claim Rebate</button>
                                <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="flex h-10 w-10 items-center justify-center rounded-lg text-slate-400 hover:bg-white/10 hover:text-white md:hidden" aria-label="Toggle Menu">
                                    {isMobileMenuOpen ? <X className="h-6 w-6" /> : <Menu className="h-6 w-6" />}
                                </button>
                            </div>
                        </div>

                        {isMobileMenuOpen && (

                                <div className="flex flex-col gap-4 px-4 py-6">
                                    <button onClick={() => handleSmoothScroll("scheme-deep-dive")} className="text-left text-base font-semibold text-slate-300 hover:text-white">SuRIA Scheme 2026</button>
                                    <button onClick={() => handleSmoothScroll("interactive-calculator")} className="text-left text-base font-semibold text-slate-300 hover:text-white">Savings Calculator</button>
                                    <button onClick={() => handleSmoothScroll("site-survey")} className="mt-2 w-full rounded-lg bg-suria-gold py-3 text-center text-sm font-bold uppercase tracking-widest text-black hover:bg-yellow-500">Claim RM3,000 Rebate</button>

                    {/* 2. HERO SECTION */}

                                        </div>
                                    </div>
                                </div>

                                <div className="lg:col-span-5">
                                    <div className="relative rounded-2xl border border-white/10 bg-white/5 p-6 shadow-2xl backdrop-blur-md">

                                                    <span className="text-[10px] text-slate-400 uppercase font-medium">Mins</span>
                                                </div>
                                                <div className="rounded-xl bg-[#021513] border border-white/5 p-3">
                                                    <span className="block font-display text-3xl font-bold text-suria-gold">{timeLeft.seconds}</span>
                                                    <span className="text-[10px] text-slate-400 uppercase font-medium">Secs</span>
                                                </div>
                                            </div>
                                        </div>

                    </section>

                    {/* 3. SCHEME DEEP DIVE SECTION */}

                        <div className="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                            <div className="text-center">

                                    TNB SuRIA Home Cash Rebate Framework
                                </h2>
                            </div>

                            <div className="mt-12 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
                                <div className="rounded-2xl bg-white/5 p-6 border border-white/10">
                                    <div className="flex h-12 w-12 items-center justify-center rounded-xl bg-suria-gold/10 text-suria-gold mb-4"><Coins className="h-6 w-6" /></div>
                                    <h3 className="font-display text-lg font-bold text-white">Up to RM3,000 Payout</h3>
                                    <p className="mt-2 text-sm text-slate-400 leading-relaxed">Direct cash incentive computed precisely at <strong>RM600 per kWac</strong> capacity.</p>
                                </div>
                                <div className="rounded-2xl bg-white/5 p-6 border border-white/10">

                                </div>

                                    <div className="flex h-12 w-12 items-center justify-center rounded-xl bg-suria-gold/10 text-suria-gold mb-4"><Shield className="h-6 w-6" /></div>
                                    <h3 className="font-display text-lg font-bold text-white">Direct Ledger Transfer</h3>

                    </section>

                    {/* 4. INTERACTIVE CALCULATOR SECTION */}
                    <section id="interactive-calculator" className="py-20 bg-gradient-to-b from-suria-darker to-suria-dark">
                        <div className="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                            <div className="text-center max-w-3xl mx-auto mb-16">
                                <h2 className="font-display text-3xl font-extrabold text-white">Solar Investment & Savings Simulator</h2>
                                <p className="text-slate-400 mt-4">Adjust the slider below to represent your typical monthly TNB electricity bill.</p>
                            </div>

                            <div className="grid lg:grid-cols-12 gap-8 items-start">
                                <div className="lg:col-span-5 bg-white/5 p-6 rounded-2xl border border-white/10">
                                    <label className="block text-sm font-semibold tracking-wide text-slate-300 uppercase">Average Monthly Bill Amount</label>
                                    <div className="text-4xl font-display font-extrabold text-suria-gold mt-2">RM {billAmount}</div>
                                    <input 
                                        type="range" 
                                        min="100" 
                                        max="1500" 
                                        step="50" 
                                        value={billAmount} 
                                        onChange={(e) => setBillAmount(Number(e.target.value))}
                                        className="w-full mt-4 h-2 bg-white/10 rounded-lg appearance-none cursor-pointer accent-suria-gold"
                                    />
                                    <div className="flex justify-between text-xs text-slate-500 mt-2 font-mono">
                                        <span>RM 100</span>
                                        <span>RM 1,500</span>
                                    </div>
                                    <div className="mt-6 space-y-2">
                                        <div className="text-xs font-semibold uppercase text-slate-400 tracking-wider">Quick Presets</div>
                                        <div className="flex flex-wrap gap-2">
                                            {[250, 450, 750, 1200].map((amt) => (
                                                <button key={amt} onClick={() => setBillAmount(amt)} className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${billAmount === amt ? 'bg-suria-gold text-black border-suria-gold' : 'bg-white/5 text-slate-300 border-white/10 hover:bg-white/10'}`}>RM {amt}</button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="lg:col-span-7 bg-white/5 border border-white/10 rounded-2xl p-6 sm:p-8 grid gap-6 sm:grid-cols-2">
                                    <div className="sm:col-span-2 border-b border-white/10 pb-4">
                                        <span className="text-xs font-mono text-suria-teal uppercase tracking-wider">Configured Profile Matrix</span>
                                        <h3 className="text-lg font-bold text-white mt-1">{calculation.tierLabel}</h3>
                                    </div>
                                    <div className="bg-white/5 border border-white/5 p-4 rounded-xl">
                                        <span className="text-xs text-slate-400 block">Recommended Capacity</span>
                                        <span className="text-2xl font-display font-bold text-white">{calculation.capacity} kWac</span>
                                    </div>
                                    <div className="bg-white/5 border border-white/5 p-4 rounded-xl">
                                        <span className="text-xs text-slate-400 block">Est. Hardware Cost</span>
                                        <span className="text-2xl font-display font-bold text-white">RM {calculation.estCost.toLocaleString()}</span>
                                    </div>
                                    <div className="bg-suria-green/20 border border-suria-green/30 p-4 rounded-xl">
                                        <span className="text-xs text-suria-teal block">SuRIA Initiative Rebate</span>
                                        <span className="text-2xl font-display font-bold text-suria-gold">- RM {calculation.rebate.toLocaleString()}</span>
                                    </div>
                                    <div className="bg-white/5 border border-white/5 p-4 rounded-xl">
                                        <span className="text-xs text-slate-400 block">Net System Capital investment</span>
                                        <span className="text-2xl font-display font-bold text-suria-teal">RM {calculation.finalCost.toLocaleString()}</span>
                                    </div>
                                    <div className="bg-white/5 border border-white/5 p-4 rounded-xl">
                                        <span className="text-xs text-slate-400 block">Estimated Monthly Savings</span>
                                        <span className="text-2xl font-display font-bold text-emerald-400">RM {calculation.monthlySavings} / mo</span>
                                    </div>
                                    <div className="bg-white/5 border border-white/5 p-4 rounded-xl">
                                        <span className="text-xs text-slate-400 block">Estimated Payback ROI Period</span>
                                        <span className="text-2xl font-display font-bold text-white">{calculation.paybackYears} Years</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* 5. SITE SURVEY LEAD CAPTURE FORM */}
                    <section id="site-survey" className="py-20 border-t border-white/5 bg-[#010b0a]">
                        <div className="mx-auto max-w-3xl px-4 sm:px-6">
                            <div className="bg-gradient-to-b from-white/10 to-white/5 rounded-2xl border border-white/10 p-8 shadow-2xl">
                                <div className="text-center mb-8">
                                    <span className="text-xs font-bold font-mono tracking-widest text-suria-gold uppercase">Secure Allocation System</span>
                                    <h2 className="text-2xl sm:text-3xl font-display font-bold text-white mt-2">Claim Your Government Pool Grant</h2>
                                    <p className="text-slate-400 text-sm mt-2">Submit architectural validation metrics to lock in the RM3,000 cash rebate quota.</p>
                                </div>

                                {isSubmitted ? (
                                    <div className="text-center py-12 bg-suria-green/20 border border-suria-green rounded-xl p-6">
                                        <div className="h-12 w-12 bg-suria-gold text-black rounded-full flex items-center justify-center mx-auto text-xl font-bold">✓</div>
                                        <h3 className="text-xl font-bold text-white mt-4">Pre-Registration Complete!</h3>
                                        <p className="text-slate-300 text-sm mt-2">An engineering advisor will contact you within 24 working hours to evaluate your roof dimensions via geographic simulation software.</p>
                                    </div>
                                ) : (
                                    <form onSubmit={handleSubmitForm} className="space-y-6">
                                        <div className="grid sm:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-medium text-slate-400 uppercase tracking-wider">Full Name (As per NIRC / Meter)</label>
                                                <input required type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full mt-1.5 bg-suria-dark border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-suria-gold" placeholder="John Doe" />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-slate-400 uppercase tracking-wider">Mobile Number (WhatsApp Link)</label>
                                                <input required type="tel" value={formData.phone} onChange={(e) => setFormData({...formData, phone: e.target.value})} className="w-full mt-1.5 bg-suria-dark border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-suria-gold" placeholder="+60123456789" />
                                            </div>
                                        </div>

                                        <div className="grid sm:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-medium text-slate-400 uppercase tracking-wider">State / Region Location</label>
                                                <select value={formData.stateLocation} onChange={(e) => setFormData({...formData, stateLocation: e.target.value})} className="w-full mt-1.5 bg-suria-dark border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-suria-gold">
                                                    <option>Kuala Lumpur</option>
                                                    <option>Selangor</option>
                                                    <option>Penang</option>
                                                    <option>Johor</option>
                                                    <option>Perak</option>
                                                    <option>Other States</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-slate-400 uppercase tracking-wider">Property Structural Typology</label>
                                                <select value={formData.propertyType} onChange={(e) => setFormData({...formData, propertyType: e.target.value})} className="w-full mt-1.5 bg-suria-dark border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-suria-gold">
                                                    <option>Landed Terrace</option>
                                                    <option>Semi-Detached</option>
                                                    <option>Bungalow / Villa</option>
                                                    <option>Commercial Unit</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="flex items-start gap-3 border-t border-white/10 pt-4">
                                            <input required type="checkbox" id="agree" checked={formData.agreePolicy} onChange={(e) => setFormData({...formData, agreePolicy: e.target.checked})} className="mt-1 accent-suria-gold" />
                                            <label htmlFor="agree" className="text-xs text-slate-400 leading-relaxed">I authorize independent engineering consultants to cross-verify my building coordinate proxies with SEDA guidelines and calculate financial offsets.</label>
                                        </div>

                                        <button type="submit" className="w-full py-4 bg-suria-gold text-black font-bold uppercase tracking-widest rounded-xl hover:bg-yellow-500 transition-colors shadow-lg shadow-yellow-550/10">
                                            Lock My RM3,000 Allocation Now
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    </section>

                    {/* 6. COMPREHENSIVE LEGAL FOOTER */}
                    <footer className="border-t border-white/10 bg-suria-darker py-12">
                        <div className="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                            <div className="flex flex-col gap-6 text-xs text-slate-500 sm:flex-row sm:justify-between items-start">
                                <div className="max-w-3xl space-y-2 leading-relaxed">
                                    <p><strong>MySuriaHome Independent Advisory Disclaimer:</strong><br />`www.mysuriahome.com` is hosted by professional, independent engineering solar consultants assisting consumers through clean tech alignments. We do not legally represent, belong to, nor function as an official statutory extension of SEDA Malaysia, the Ministry of Energy Transition and Water Transformation (PETRA), or Tenaga Nasional Berhad (TNB).</p>
                                    <p>All calculations generated on this domain represent design simulation proxies modeled on standardized residential system yields. Actual payout validation rules rest exclusively upon structural verification checks, SolaRIS historical exclusion checks, and final TNB field meter confirmation reviews.</p>
                                    <p>&copy; {currentYear} MySuriaHome. SEDA, TNB, SolaRIS, and myTNB marks remain protected trade assets owned exclusively by their respective corporate and state legal entities.</p>
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
