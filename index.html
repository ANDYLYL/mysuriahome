            // Active FAQ state

            useEffect(() => {
                const calculateTimeLeft = () => {
                    const now = new Date().getTime();
                    const launchDate = new Date(SURIA_SCHEME_VALID_FROM).getTime();
                    const difference = launchDate - now;

                    if (difference <= 0) {
                        setTimeLeft((prev) => ({ ...prev, isLaunched: true }));
                        return;
                    }

                    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
                    const minutes = Math.floor((difference / 1000 / 60) % 60);
                    const seconds = Math.floor((difference / 1000) % 60);

                    setTimeLeft({ days, hours, minutes, seconds, isLaunched: false });
                };

                calculateTimeLeft();
                const interval = setInterval(calculateTimeLeft, 1000);
                return () => clearInterval(interval);
            }, []);

                    estCost = 16000;
                    rebate = 2400;
                    finalCost = 13600;
                    monthlySavings = 120;
                    tierLabel = "Tier 1: Comfort Eco";

                    estCost = 19500;
                    rebate = 3000; // Cap at RM3,000 max

                    monthlySavings = 220;

                    rebate = 3000; // Cap at RM3,000 max

                    monthlySavings = 380;

                    rebate = 3000; // Cap at RM3,000 max

                    monthlySavings = 550;
                    tierLabel = "Tier 4: Ultimate Energy Independence";

                const co2Offset = Number((capacity * 1.25).toFixed(2)); // Approx 1.25 tons of CO2 offset per year per Malaysia grid factor

                    estCost,
                    rebate,
                    finalCost,
                    monthlySavings,
                    paybackYears,
                    panelsCount,
                    roofSpace,
                    co2Offset,
                    tierLabel,
